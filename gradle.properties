# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
# NeoForm decompiles Minecraft on first run and needs headroom.
org.gradle.jvmargs=-Xmx4G
org.gradle.daemon=false

# NeoForge port; mod_version tracks the upstream TConstruct version it derives from.
mod_version=3.12.1
# fork_version is THIS fork's release number; bump it every published release (1.0 -> 1.1 -> 1.2 ...).
# Final version string and jar name = <minecraft_version>-<mod_version>-v<fork_version>.
# 1.25: FULL release. Fixes a data-loss bug where a single unparseable stored item wiped an ENTIRE Tinkers' chest
# on load (any throw in readInventory propagated out of loadAdditional, and vanilla's BlockEntity.loadStatic discards
# the whole block entity on a load throw, so the chest reloaded empty). readInventory now parses each slot
# independently, logging and skipping only the bad stack and keeping every item that still loads. Promotes the
# v1.22-v1.24 dev line: smeltery fuel/temperature fixes, slime hitboxes, EMI rendering, Luck/Fortune drops, blazing blood.
# 1.26: three fixes. (a) EMI "+" recipe transfer for the Crafting Station: registered a StandardRecipeHandler +
# vanilla-crafting workstation (EMI had NO handler for the menu, so it said "workstation does not support recipe";
# JEI already worked). (b) Crossbow loaded model (#13): the tconstruct:ammo item property read minecraft:custom_data,
# but tools store NBT in the tconstruct:tool_data component, so it was always 0 and the charged model never rendered;
# now reads ToolDataComponents.getTag like the other properties. (c) Smeltery/Foundry fuel gauge blank on reopen (#7
# regression): clearFluidListeners() called resetHandler(null) which also wiped lastPos (the tank position the GUI
# renders from), and routine structure re-checks kept clearing it; now clears only the active handler (clearLastListener),
# and getFuelInfo() falls back to the first tank actually holding fuel instead of blindly the first structural tank.
# 1.28-dev: mobs spawn with ancient tools again (#24): the finalize-spawn handler used setSpawnCancelled, which
# deletes the equipped mob, instead of setCanceled which only skips vanilla finalize. Melting a mob's dropped items
# with a melting weapon now keeps the fluid (#23): ToolAttackUtil refreshes its tool view after death loot, same
# clobber as the melting pan (#16). Ports upstream 1.20.1 fixes: SetStatModule drops unsupported stats, slimes and
# magma cubes no longer drown in liquid slime, necrotic accepts any wither bone tag, netherite advancement filters
# to harvest tools, fiery material fallbacks, Create-movable enderbark roots + tree attachment, redrawn necrotic/
# severing textures.
# 1.29: FULL release. Promotes the v1.27-dev and v1.28-dev line (melting pan fluids #16, luck on pants #18, break XP
# #22, copper can #19, harvest tiers #17, shell storage #21, virtual enchantments #20, luck mob drops #18, ancient
# tools on mobs #24, mob drop melting #23, and the upstream 1.20.1 sync) to a full release, and adds: modded utility
# blocks (Farmer's Delight cutting board, Etched table) are interactable again while wearing a Tinkers chestplate with
# empty hands (#27), the chestplate interaction handler skipped the block's useItemOn, which 1.21 calls before
# useWithoutItem, then canceled the event so vanilla could not run it either.
# 1.30-dev: syncs upstream Tinkers' Construct 1.20.1 to 3.12.1+ (through 1b1d701ce7, about 460 commits: slimesuit
# and laces rework, phantom cuirass, fancy armor stands, edible tools, part builder and JEI rework, material rarity).
# Fixes #7/#28 (structure and servant positions dropped, PR #30 by erukafroggy), #29 (large smeltery slot desync),
# #25 follow-up, #21/#22/#11 follow-ups, smeltery item sync. Old tools rebuild once; removed heads alias to vanilla.
# Luck can no longer be added to leggings (upstream). Needs Neo Mantle v1.26+; JEI integration needs JEI 19.51+.
# 1.31-dev (26.3): playtest fixes. Creative tab crash fixed (Mantle block atlas id), books match 1.21.1 (book font, 1.20
# book item data, tooltips, page JSON), Tinkers mob heads visible, translucent fluids in containers, creative cast chests
# keep their casts, dyed chest colour kept and chest dyeable in the crafting grid, playerWillDestroy state passed on,
# enchantments restored exactly. Needs Neo Mantle v1.28+ for 26.3.
# 1.31 (26.3): full release of 1.31-dev for 26.3 after the playtest retest passed.
# 1.32-dev: fix a crash when other mods ask a Tinkers tool for an enchantment level with an unbound holder
# (Weapons of Miracles + mobs holding ancient tools), enchantment holders are now compared by registry key.
# 1.32: full release of 1.32-dev after the crash fix passed in-game tests on both lines.
# 1.33-dev: Tinkers arrows no longer crash and bows apply their enchantments to them (#33), faucets no longer get stuck
# pouring (#32), the block break handler runs after other mods so vein miners and protection mods work (#34).
fork_version=1.33-dev

# Minecraft Version Information
minecraft_base_version=26.3
minecraft_version=26.3
minecraft_range=[26.3,26.4)

# NeoForge Version Information
neoforge_version=26.3.0.103
neoforge_range=[26.3.0.103,)

# Mantle dependency: built from the sibling vancevoj/Mantle port via composite build (see settings.gradle).
mantle_version=1.21.0
# Neo Mantle reports <mc>-<mod_version>-v<fork>; require the fork that has the APIs this build uses, so an older
# Neo Mantle shows NeoForge's missing-dependency screen instead of crashing mid-game (see neotinkers #26).
mantle_range=[26.3-1.21.0-v1.28,)

# Optional compat (26.3 coordinates; wire in as each integration package is ported)
jei_version=31.17.0.113
jei_range=[31.17.0,)
json_things_version=0.10.2
json_things_range=[0.10.0,)
ie_version=12.4.0-180
# EMI has no 26.x build, the EMI plugin is excluded from compilation
