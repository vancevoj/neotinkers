issueTrackerURL="https://github.com/vancevoj/NeoTinkersConstruct/issues"
logoFile="logo.png"
license="MIT"

[[mods]]
    modId="tconstruct"
    version="${version}"
    displayName="Neo Tinkers"
    enumExtensions="META-INF/enumextensions.json"
    authors="Slime Knights, vancevoj"
    description='''
A little of this, a little of that, a lot of tinkering, and a lot of tools. Neo Tinkers is vancevoj's NeoForge 26.3 port of Slime Knights' Tinkers' Construct ${mod_version}; it was inspired by their work and nearly all of the design and programming belong to them.
    '''
    displayURL="https://github.com/vancevoj/NeoTinkersConstruct"

# Data compatibility: restores projectile modifiers saved by Neo Tinkers for 1.21.1, see slimeknights.tconstruct.mixin.EntityMixin
[[mixins]]
    config="tconstruct.mixins.json"

[[dependencies.tconstruct]]
    modId="neoforge"
    type="required"
    versionRange="${neoforge_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.tconstruct]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.tconstruct]]
    modId="mantle"
    type="required"
    versionRange="${mantle_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.tconstruct]]
    modId="jei"
    type="optional"
    versionRange="${jei_range}"
    ordering="NONE"
    side="BOTH"

